<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phishy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-lg p-4">
      <div class="text-center mb-4">
        <h2>Phishy</h2>
        <p class="text-muted mb-0">Complete the form to continue.</p>
      </div>
      <div id="loading" class="text-center py-4">
        <div class="spinner-border" role="status"></div>
        <p class="mt-2 mb-0">Loading...</p>
      </div>
      <div id="error" class="d-none alert alert-danger text-center">
        <span id="errorMessage">Unable to load this link.</span>
      </div>
      <form id="quizForm" class="d-none">
        <div id="quizContainer"></div>
        <div id="timerContainer" class="alert alert-secondary text-center mt-4">
          Redirecting in <strong id="timer">--</strong> seconds
        </div>
        <div id="status" class="text-center mb-3"></div>
        <button id="submitButton" class="btn btn-dark w-100" type="submit">Submit</button>
      </form>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
