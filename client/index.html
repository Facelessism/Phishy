<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>MCQ Test</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="card shadow-lg p-4">

      <h2 class="text-center mb-4">MCQ Test</h2>

      <form id="quizForm">

        <div class="mb-4">
          <h5>1. What does HTML stand for?</h5>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="q1" value="A">
            <label class="form-check-label">
              Hyper Text Markup Language
            </label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="q1" value="B">
            <label class="form-check-label">
              High Transfer Machine Language
            </label>
          </div>
        </div>

        <div class="mb-4">
          <h5>2. Which language runs in browser?</h5>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="q2" value="A">
            <label class="form-check-label">
              JavaScript
            </label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="q2" value="B">
            <label class="form-check-label">
              Python
            </label>
          </div>
        </div>

        <button class="btn btn-primary w-100" type="submit">
          Submit Test
        </button>

      </form>

      <div id="status" class="mt-3 text-center"></div>

    </div>
  </div>

  <script src="index.js"></script>

</body>
</html>
