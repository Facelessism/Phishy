<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Phishy Admin</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/style.css">
</head>

<body class="bg-light">

  <div class="container py-5">

    <div class="card shadow-lg p-4">

      <h2 class="text-center mb-4">Phishy Admin</h2>

      <form id="adminForm">

        <div class="mb-3">
          <label for="adminToken" class="form-label">
            Admin Token
          </label>

          <input
            type="password"
            id="adminToken"
            class="form-control"
            placeholder="Enter admin token"
            required
          >
        </div>

        <div class="mb-3">
          <label for="redirectUrl" class="form-label">
            Destination URL
          </label>

          <input
            type="url"
            id="redirectUrl"
            class="form-control"
            placeholder="https://docs.google.com/..."
            required
          >
        </div>

        <div class="mb-4">
          <label for="redirectTime" class="form-label">
            Redirect Time (0-1000 seconds)
          </label>

          <input
            type="number"
            id="redirectTime"
            class="form-control"
            min="0"
            max="1000"
            step="0.00001"
            placeholder="15"
            required
          >
        </div>

        <hr>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0">Quiz Builder</h4>

          <div>
            <button
              type="button"
              id="addMcq"
              class="btn btn-outline-primary btn-sm me-2"
            >
              + MCQ
            </button>

            <button
              type="button"
              id="addText"
              class="btn btn-outline-secondary btn-sm"
            >
              + Fill in Blank
            </button>
          </div>
        </div>

        <div id="questionsContainer"></div>

        <div
          id="emptyQuizMessage"
          class="text-center text-muted py-4 border rounded mb-3"
        >
          No questions added yet.
          <br>
          Use the buttons above to add a question.
        </div>

        <button
          type="submit"
          class="btn btn-dark w-100 mt-3"
        >
          Generate Phishy Link
        </button>

      </form>

      <div id="adminStatus" class="mt-4"></div>

      <div id="generatedLink" class="mt-3 d-none">
        <label class="form-label fw-bold">
          Your Phishy Link
        </label>

        <div class="input-group">
          <input
            type="text"
            id="shortUrl"
            class="form-control"
            readonly
          >

          <button
            type="button"
            id="copyLink"
            class="btn btn-outline-dark"
          >
            Copy
          </button>
        </div>
      </div>

    </div>

  </div>

  <script src="/admin.js"></script>

</body>
</html>
